# Example: gate PRs with a Grok review.
#
# 1. Copy this file to .github/workflows/grok-review.yml in your repo.
# 2. Add XAI_API_KEY as a repo secret (Settings → Secrets and variables → Actions).
# 3. Open a PR — Grok will post a sticky review comment and fail the check on `block`.
#
# Get an API key at https://console.x.ai (pay-per-call, no subscription cap).
#
# Cost-control notes already baked in below:
# - paths-ignore skips docs/asset-only PRs (most code reviews aren't useful there)
# - concurrency cancels outdated runs on the same PR (saves tokens, surfaces latest verdict)
# - skips dependabot/renovate (dep-bump reviews are usually low signal)
# - skips when PR carries the `skip-grok-review` label (manual opt-out)

name: Grok review

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'assets/**'
      - 'docs/**'
      - 'examples/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

concurrency:
  group: grok-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  grok-review:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.user.login != 'renovate[bot]'
      && !contains(github.event.pull_request.labels.*.name, 'skip-grok-review')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: howardpen9/grok-mcp/.github/actions/grok-review@main
        with:
          xai-api-key: ${{ secrets.XAI_API_KEY }}
          gate-on: block           # also accepts: block,request_changes
          # focus: security        # optional — narrow the review
          # min-score: 6           # optional — fail any dimension below this
          # comment: 'true'        # sticky PR comment, default on
