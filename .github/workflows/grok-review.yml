name: Grok review

on:
  pull_request:
    branches: [main]
    # Skip pure-docs / asset-only PRs — they almost never need an AI review
    # and burn API tokens with low signal.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'assets/**'
      - 'docs/**'
      - 'examples/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

# Cancel an outdated run when new commits land on the same PR.
# Saves API tokens AND surfaces the latest verdict faster.
concurrency:
  group: grok-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  grok-review:
    runs-on: ubuntu-latest
    # Skip on forks (no access to secrets).
    # Skip on dependabot / renovate PRs — automated dep bumps are noisy
    # and a Grok review on them is rarely actionable.
    # Skip when the PR carries a `skip-grok-review` label (manual opt-out).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.user.login != 'renovate[bot]'
      && !contains(github.event.pull_request.labels.*.name, 'skip-grok-review')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Install grok CLI
        run: |
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"

      - name: Fetch base ref
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"

      - name: Grok review (local build)
        id: review
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_MCP_TIMEOUT: "600000"
        run: |
          set -uo pipefail
          if [ -z "${XAI_API_KEY:-}" ]; then
            echo "::warning::XAI_API_KEY is not set — skipping Grok review."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          JSON_OUT="$RUNNER_TEMP/grok-review.json"
          SUMMARY_OUT="$RUNNER_TEMP/grok-review.md"

          set +e
          node dist/ci-review.js \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --gate-on "block" \
            --timeout 600 \
            --json-out "$JSON_OUT" \
            --summary-out "$SUMMARY_OUT"
          EXIT=$?
          set -e

          if [ -f "$SUMMARY_OUT" ]; then
            cat "$SUMMARY_OUT" >> "$GITHUB_STEP_SUMMARY"
            echo "summary_path=$SUMMARY_OUT" >> "$GITHUB_OUTPUT"
          fi
          exit $EXIT

      - name: Post sticky PR comment
        if: ${{ always() && steps.review.outputs.summary_path != '' && steps.review.outputs.skipped != 'true' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: grok-review
          path: ${{ steps.review.outputs.summary_path }}
