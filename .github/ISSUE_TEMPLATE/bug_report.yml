name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below so we can reproduce and fix the issue.

  - type: input
    id: version
    attributes:
      label: grok-mcp version
      description: "Output of `node -e \"console.log(require('./package.json').version)\"`"
      placeholder: "e.g. 1.2.0"
    validations:
      required: true

  - type: dropdown
    id: mcp-host
    attributes:
      label: MCP Host
      description: Which MCP-compatible host are you using?
      options:
        - Claude Code
        - Cursor
        - Cline
        - OpenClaw
        - Other
    validations:
      required: true

  - type: input
    id: mcp-host-version
    attributes:
      label: MCP Host version
      description: "Version of your MCP host (e.g. Claude Code 1.0.0)"
      placeholder: "e.g. Cursor 0.45.0"

  - type: input
    id: grok-cli-version
    attributes:
      label: Grok CLI version
      description: "Output of `grok --version` or `npx grok --version`"
      placeholder: "e.g. 0.3.0"

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: "Output of `node --version`"
      placeholder: "e.g. v20.11.0"

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Configure the MCP server with...
        2. Call the `grok_chat` tool with...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages or logs if available.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information (environment variables, config snippets, etc.)
